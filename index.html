  <div class="mhead"><h2>${isNew?'Registrar kaizen':'Editar carátula'}</h2><button data-close aria-label="Cerrar">×</button></div>
  <div class="mbody">
    <div class="pwbox"><div><b>Cargar desde el Excel de prework</b>${isNew?' <span class="pill st-Atrasado">Obligatorio</span>':''}<div class="hint">${isNew?'Para registrar un kaizen nuevo es obligatorio cargar su prework. ':(k.prework?`Prework cargado: ${esc(k.prework.archivo)}. `:'')}Llena la carátula con los datos de la hoja Pre-work: descripción, propósito, beneficios, impacto al cliente, tipo de evento, fechas, métricos, ahorro estimado y equipo. Revisa los campos y después guarda.</div><div class="hint" id="pw_msg" style="margin-top:6px;font-weight:500"></div></div><label class="btn sm pwbtn">Elegir archivo de prework<input type="file" id="pw_file" accept=".xls,.xlsx,.xlsm" hidden></label></div>
    <fieldset><legend>Enfoque del kaizen</legend><div class="fg">
      <label>Clave<input id="f_clave" value="${esc(k.clave??nextClave)}"></label>
      <label class="c2">Nombre del evento<input id="f_nombre" value="${esc(k.nombre)}" required></label>
      <label>Tipo de evento<select id="f_tipo"><option value=""></option>${TIPOS.map(t=>`<option ${t===k.tipoEvento?'selected':''}>${t}</option>`).join('')}</select></label>
      <label class="c4">Objetivo (resumen en una línea)<input id="f_detalle" value="${esc(k.detalle)}" placeholder="Ej. Reducir la merma en calibre delgado del 2.2% al 1.54%"></label>
      <label class="c2">Descripción del proceso<textarea id="f_desc">${esc(k.descripcion)}</textarea></label>
      <label class="c2">Propósito del evento<textarea id="f_prop">${esc(k.proposito)}</textarea></label>
      <label class="c2">Beneficios a desarrollar<textarea id="f_ben">${esc(k.beneficios)}</textarea></label>
      <label class="c2">Impacto al cliente<textarea id="f_cli" placeholder="Entregas, calidad, costo">${esc(k.impactoCliente)}</textarea></label>
      <div class="c4"><div class="hint" style="margin-bottom:6px;font-weight:500">Enfoque de la mejora</div><div class="checks">${ENFOQUES.map(([val,l])=>`<label><input type="checkbox" name="f_enf" value="${val}" ${enf.includes(val)?'checked':''}> ${l}</label>`).join('')}</div></div>
    </div></fieldset>
    <fieldset><legend>Responsables y fechas</legend><div class="fg">
      <label>Área<input id="f_area" list="dl_area" value="${esc(k.area)}"><datalist id="dl_area">${areas.map(a=>`<option value="${esc(a)}">`).join('')}</datalist></label>
      <label>Líder<input id="f_lider" value="${esc(k.lider)}"></label>
      <label>Coach<input id="f_coach" list="dl_coach" value="${esc(k.coach)}"><datalist id="dl_coach">${coaches.map(a=>`<option value="${esc(a)}">`).join('')}</datalist></label>
      <label>Responsable del área<input id="f_resp" value="${esc(k.responsableArea)}"></label>
      <label>Prioridad<select id="f_prio">${['Alta','Media','Baja'].map(p=>`<option ${p===(k.prioridad||'Media')?'selected':''}>${p}</option>`).join('')}</select></label>
      <label>Inicio<input type="date" id="f_ini" value="${esc(k.inicio)}"></label>
      <label>Fin planeado<input type="date" id="f_fin" value="${esc(k.fin)}"></label>
      <label>Cierre oficial<input type="date" id="f_cierre" value="${esc(k.fechaCierre)}"></label>
      <label>Paso actual<select id="f_paso">${STEPS.map((s,i)=>`<option value="${i+1}" ${i+1===(Number(k.pasoActual)||1)?'selected':''}>${i+1}. ${s}</option>`).join('')}</select></label>
      <label>Avance (%)<input type="number" min="0" max="100" id="f_av" value="${esc(k.avance??0)}"></label>
      <label>Causa de atraso<select id="f_causa"><option value="">Sin atraso o sin registrar</option>${CAUSAS.map(c=>`<option ${c===k.causaAtraso?'selected':''}>${c}</option>`).join('')}</select></label>
      <label style="justify-content:flex-end"><span class="checks"><label><input type="checkbox" id="f_canc" ${k.cancelado?'checked':''}> Cancelado</label></span></label>
      <label class="c4">Observaciones<textarea id="f_obs">${esc(k.observaciones)}</textarea></label>
    </div></fieldset>
    <fieldset><legend>Métrico primario y ahorros</legend><div class="fg">
      <label class="c2">Métrico primario *<input id="m_nom" value="${esc(m.nombre)}" placeholder="Ej. Tiempo de captura por bobina"></label>
      <label>Unidad<input id="m_uni" value="${esc(m.unidad)}" placeholder="s, kg, %, min"></label>
      <label>Sentido de mejora<select id="m_sen"><option value="reducir" ${m.sentido!=='aumentar'?'selected':''}>Reducir</option><option value="aumentar" ${m.sentido==='aumentar'?'selected':''}>Aumentar</option></select></label>
      <label>Línea base *<input type="number" step="any" id="m_base" value="${esc(m.base)}"></label>
      <label>Meta *<input type="number" step="any" id="m_meta" value="${esc(m.meta)}"></label>
      <label>Resultado<input type="number" step="any" id="m_res" value="${esc(m.resultado)}"></label>
      <span></span>
      <label class="c2">Ahorro estimado (MXN)<input type="number" step="any" id="f_ahE" value="${esc(k.ahorroEstimado)}"></label>
      <label class="c2">Ahorro validado por Costos (MXN)<input type="number" step="any" id="f_ahV" value="${esc(k.ahorroValidado)}"></label>
    </div></fieldset>
    <fieldset><legend>Métricos secundarios</legend>
      <div id="ms_rows" style="display:flex;flex-direction:column;gap:10px"></div>
      <button type="button" class="btn sm" id="ms_add" style="margin-top:10px">Agregar métrico secundario</button>
    </fieldset>
    <fieldset><legend>Equipo kaizen</legend>
      <label>Un integrante por renglón, con su rol después de una coma<textarea id="f_eq" rows="5" placeholder="Gamaliel Martínez, Líder del kaizen&#10;Jesús Ruiz, Integrante">${esc((k.equipo||[]).map(p=>p.rol?`${p.nombre}, ${p.rol}`:p.nombre).join('\n'))}</textarea></label>
      <span class="hint">De 3 a 5 integrantes según el estándar de eventos kaizen.</span>
    </fieldset>
    <div class="err" id="f_err"></div>
  </div>
  <div class="mfoot">${!isNew && S.user && (S.canWrite!==false) ? `<button class="btn danger" id="f_del">Eliminar kaizen</button>`:''}<span class="sp"></span><button class="btn" data-close>Cancelar</button><button class="btn pri" id="f_save">${isNew?'Registrar kaizen':'Guardar cambios'}</button></div>`);
  const msRow = (x={}) => `<div class="fg ms">
    <label>Métrico<input class="ms_nom" value="${esc(x.nombre)}" placeholder="Ej. Uso de papel por turno"></label>
    <label>Unidad<input class="ms_uni" value="${esc(x.unidad)}"></label>
    <label>Sentido<select class="ms_sen"><option value="reducir" ${x.sentido!=='aumentar'?'selected':''}>Reducir</option><option value="aumentar" ${x.sentido==='aumentar'?'selected':''}>Aumentar</option></select></label>
    <label>Línea base<input type="number" step="any" class="ms_base" value="${esc(x.base)}"></label>
    <label>Meta<input type="number" step="any" class="ms_meta" value="${esc(x.meta)}"></label>
    <label>Resultado<input type="number" step="any" class="ms_res" value="${esc(x.resultado)}"></label>
    <button type="button" class="btn ghost sm ms_del" style="color:var(--bad);padding:8px 4px">Quitar</button></div>`;
  const msBox=modal.querySelector('#ms_rows');
  msBox.innerHTML=(k.metricosSec||[]).map(msRow).join('');
  modal.querySelector('#ms_add').onclick=()=>{ msBox.insertAdjacentHTML('beforeend',msRow()); const r=msBox.lastElementChild.querySelector('.ms_nom'); if(r) r.focus(); };
  msBox.addEventListener('click',e=>{ const d=e.target.closest('.ms_del'); if(d) d.closest('.ms').remove(); });
  let pwFile=null;
  modal.querySelector('#pw_file').addEventListener('change', async e=>{
    const f=e.target.files[0]; if(!f) return; const msg=modal.querySelector('#pw_msg'); msg.style.color=''; msg.textContent='Leyendo el prework…';
    try{
      const XLSX=await loadXLSX();
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
      const p=parsePrework(wb);
      if(!p){ msg.style.color='var(--bad)'; msg.textContent='No encontré la hoja Pre-work en este archivo.'; e.target.value=''; return; }
      const set=(id,val)=>{ if(val===null||val===undefined||val==='') return false; const el=modal.querySelector('#'+id); if(!el) return false; el.value=val; return true; };
      const done=[];
      if(!v('f_nombre').trim() && p.nombre){ set('f_nombre',p.nombre); done.push('nombre'); }
      if(set('f_desc',p.descripcion)) done.push('descripción');
      if(set('f_prop',p.proposito)) done.push('propósito');
      if(set('f_ben',p.beneficios)) done.push('beneficios');
      if(set('f_cli',p.cliente)) done.push('impacto al cliente');
      if(set('f_tipo',p.tipo)) done.push('tipo de evento');
      if(set('f_resp',p.dueno)) done.push('responsable del área');
      if(set('f_ini',p.inicio)) done.push('fecha de inicio');
      if(set('f_fin',p.fin)) done.push('fecha fin');
      if(p.metrico.nombre){ set('m_nom',p.metrico.nombre); set('m_base',p.metrico.base); set('m_meta',p.metrico.meta); set('m_uni',p.metrico.unidad); set('m_sen',p.metrico.sentido); done.push('métrico primario'); }
      if(set('f_ahE',p.ahorro)) done.push('ahorro estimado');
      if(p.secundario.nombre && ![...msBox.querySelectorAll('.ms_nom')].some(i=>i.value.trim().toLowerCase()===p.secundario.nombre.toLowerCase())){ msBox.insertAdjacentHTML('beforeend',msRow(p.secundario)); done.push('métrico secundario'); }
      if(p.equipo.length){ set('f_eq',p.equipo.map(x=>x.rol?`${x.nombre}, ${x.rol}`:x.nombre).join('\n')); done.push(`equipo (${p.equipo.length} integrantes)`); }
      if(done.length) pwFile={archivo:f.name,fecha:iso(today())};
      msg.style.color = done.length ? 'var(--ok)' : 'var(--bad)';
      msg.textContent = done.length ? `Se llenó: ${done.join(', ')}. Revisa los datos y da clic en Guardar.${p.notas.length?' '+p.notas.join(' '):''}` : 'El prework no tiene datos en los campos esperados.';
    }catch(err){ msg.style.color='var(--bad)'; msg.textContent='No se pudo leer el archivo. Verifica que sea el formato de prework en Excel y que tengas conexión a internet.'; }
    e.target.value='';
  });
  modal.querySelector('#f_save').onclick = async ()=>{
    const nombre=v('f_nombre').trim();
    const ferr=modal.querySelector('#f_err'); const stop=t=>{ ferr.textContent=t; ferr.scrollIntoView({block:'center',behavior:'smooth'}); };
    if(isNew && !pwFile){ stop('Carga el Excel de prework antes de registrar el kaizen (recuadro azul al inicio de esta ventana).'); return; }
    if(!nombre){ stop('Escribe el nombre del evento.'); return; }
    if(!modal.querySelector('#f_canc').checked){
      const miss=[]; if(!v('m_nom').trim()) miss.push('nombre del métrico'); if(num(v('m_base'))===null) miss.push('línea base'); if(num(v('m_meta'))===null) miss.push('meta');
      if(miss.length){ stop(`No se puede guardar sin los objetivos del métrico primario. Falta: ${miss.join(', ')}. Cárgalos desde el prework o captúralos en la sección Métrico primario y ahorros.`); return; }
    }
    if(v('f_ini') && v('f_fin') && v('f_fin')<v('f_ini')){ modal.querySelector('#f_err').textContent='La fecha fin no puede ser anterior a la de inicio.'; return; }
    const equipo=v('f_eq').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(','); return i>0?{nombre:l.slice(0,i).trim(),rol:l.slice(i+1).trim()}:{nombre:l,rol:''};});
    const data={
      clave:v('f_clave').trim(), nombre, tipoEvento:v('f_tipo'), detalle:v('f_detalle').trim(), descripcion:v('f_desc'), proposito:v('f_prop'), beneficios:v('f_ben'), impactoCliente:v('f_cli'),
      enfoque:[...modal.querySelectorAll('input[name=f_enf]:checked')].map(x=>x.value),
      area:v('f_area').trim(), lider:v('f_lider').trim(), coach:v('f_coach').trim(), responsableArea:v('f_resp').trim(), prioridad:v('f_prio'),
      inicio:v('f_ini'), fin:v('f_fin'), fechaCierre:v('f_cierre'), pasoActual:Number(v('f_paso'))||1, avance:Math.max(0,Math.min(100,Number(v('f_av'))||0)),
      causaAtraso:v('f_causa'), cancelado:modal.querySelector('#f_canc').checked, observaciones:v('f_obs'),
      metrico:{nombre:v('m_nom').trim(),unidad:v('m_uni').trim(),sentido:v('m_sen'),base:num(v('m_base')),meta:num(v('m_meta')),resultado:num(v('m_res'))},
      prework: pwFile || k.prework || null,
      metricosSec:[...modal.querySelectorAll('.ms')].map(r=>({nombre:r.querySelector('.ms_nom').value.trim(),unidad:r.querySelector('.ms_uni').value.trim(),sentido:r.querySelector('.ms_sen').value,base:num(r.querySelector('.ms_base').value),meta:num(r.querySelector('.ms_meta').value),resultado:num(r.querySelector('.ms_res').value)})).filter(x=>x.nombre),
      ahorroEstimado:num(v('f_ahE')), ahorroValidado:num(v('f_ahV')), equipo,
      actualizado:new Date().toISOString(), actualizadoPor:S.me||null
    };
    const btn=modal.querySelector('#f_save'); btn.disabled=true;
    let ok;
    if(isNew){
      const id='ke-'+Date.now().toString(36);
      Object.assign(data,{pendientes:[],seguimiento:{},creado:new Date().toISOString(),creadoPor:S.me||null});
      ok=await safeWrite(()=>S.db.doc('kaizens/'+id).set(data),'Kaizen registrado');
      if(ok){ closeModal(); openProject(id); return; }
    } else {
      ok=await safeWrite(()=>S.db.doc('kaizens/'+k.id).update(data),'Cambios guardados');
      if(ok) closeModal();
    }
    btn.disabled=false;
  };
  const del=modal.querySelector('#f_del');
  if(del) del.onclick = async ()=>{
    if(del.dataset.armed!=='1'){ del.dataset.armed='1'; del.textContent='Confirmar: eliminar kaizen y su carátula'; return; }
    del.disabled=true;
    const ok=await safeWrite(()=>S.db.doc('kaizens/'+k.id).delete(),'Kaizen eliminado');
    if(ok){ closeModal(); closeProject(); } else del.disabled=false;
  };
}

function avanceModal(k,etapa,a){
  if(!k) return; const isNew=!a; a=a||{}; const p=PDCA[etapa];
  const canUp=!!S.assets;
  openModal(`
  <div class="mhead"><h2>${isNew?'Agregar avance':'Editar avance'} de ${p.n}</h2><button data-close aria-label="Cerrar">×</button></div>
  <div class="mbody">
    <div class="fg">
      <label class="c2">Etapa<select id="a_et">${PDCA_ORDER.map(e=>`<option value="${e}" ${e===etapa?'selected':''}>${PDCA[e].n} (${PDCA[e].en})</option>`).join('')}</select></label>
      <label class="c2">Fecha<input type="date" id="a_fe" value="${esc(a.fecha||iso(today()))}"></label>
      <label class="c4">Título del avance<input id="a_ti" list="dl_g" value="${esc(a.titulo)}" placeholder="Ej. ${esc(p.guia[0])}"><datalist id="dl_g">${p.guia.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></label>
      <label class="c4">Descripción<textarea id="a_de" rows="7" placeholder="Qué hizo el equipo, qué encontró, datos y siguiente paso">${esc(a.descripcion)}</textarea></label>
    </div>
    ${(a.evidencias||[]).length?`<div><div class="hint" style="font-weight:500;margin-bottom:6px">Evidencias actuales (marca las que quieras quitar)</div><div class="checks">${a.evidencias.map((ev,i)=>`<label><input type="checkbox" name="a_rm" value="${i}"> ${esc(ev.name)}</label>`).join('')}</div></div>`:''}
    ${canUp?`<label>Agregar evidencias (fotos o PDF, hasta 20 MB cada una)<input type="file" id="a_fi" multiple accept="image/*,application/pdf"></label>`:`<div class="hint">No tienes permiso para subir archivos en esta vista. Puedes guardar la descripción y pedir a un editor que agregue las evidencias.</div>`}
    <div class="err" id="a_err"></div>
  </div>
  <div class="mfoot">${!isNew?`<button class="btn danger" id="a_del">Eliminar avance</button>`:''}<span class="sp"></span><button class="btn" data-close>Cancelar</button><button class="btn pri" id="a_save">${isNew?'Agregar avance':'Guardar cambios'}</button></div>`, true);
  modal.querySelector('#a_save').onclick = async ()=>{
    const titulo=v('a_ti').trim(); const err=modal.querySelector('#a_err');
    if(!titulo){ err.textContent='Escribe un título para el avance.'; return; }
    const btn=modal.querySelector('#a_save'); btn.disabled=true;
    const rm=new Set([...modal.querySelectorAll('input[name=a_rm]:checked')].map(x=>Number(x.value)));
    let evid=(a.evidencias||[]).filter((_,i)=>!rm.has(i));
    const files=[...((modal.querySelector('#a_fi')||{}).files||[])];
    for(let i=0;i<files.length;i++){
      const f=files[i]; btn.textContent=`Subiendo ${i+1} de ${files.length}…`;
      if(f.size>20*1024*1024){ err.textContent=`${f.name} pesa más de 20 MB. Redúcelo e inténtalo de nuevo.`; btn.disabled=false; btn.textContent='Guardar'; return; }
      try{ const r=await S.assets.upload(f); evid.push({id:r.id,name:f.name,type:r.contentType||f.type}); }
      catch(e){ err.textContent=`No se pudo subir ${f.name}${e&&e.code==='unsupported_type'?': usa una imagen o un PDF':''}.`; btn.disabled=false; btn.textContent='Guardar'; return; }
    }
    const data={etapa:v('a_et'),fecha:v('a_fe'),titulo,descripcion:v('a_de'),evidencias:evid,actualizado:new Date().toISOString()};
    let ok;
    if(isNew){ Object.assign(data,{autor:S.me||null,creado:new Date().toISOString()}); ok=await safeWrite(()=>S.db.collection(`kaizens/${k.id}/avances`).add(data),'Avance agregado'); }
    else ok=await safeWrite(()=>S.db.doc(`kaizens/${k.id}/avances/${a.id}`).update(data),'Avance guardado');
    if(ok){ S.tab=data.etapa; closeModal(); render(); } else { btn.disabled=false; btn.textContent='Guardar'; }
  };
  const del=modal.querySelector('#a_del');
  if(del) del.onclick = async ()=>{
    if(del.dataset.armed!=='1'){ del.dataset.armed='1'; del.textContent='Confirmar eliminación'; return; }
    const ok=await safeWrite(()=>S.db.doc(`kaizens/${k.id}/avances/${a.id}`).delete(),'Avance eliminado'); if(ok) closeModal();
  };
}

function pendModal(k,idx){
  if(!k) return; const list=[...(k.pendientes||[])]; const p=idx===null?{}:list[idx];
  openModal(`
  <div class="mhead"><h2>${idx===null?'Agregar acción pendiente':'Editar acción pendiente'}</h2><button data-close aria-label="Cerrar">×</button></div>
  <div class="mbody"><div class="fg">
    <label class="c4">Acción<input id="p_ac" value="${esc(p.accion)}"></label>
    <label class="c2">Responsable<input id="p_re" value="${esc(p.responsable)}"></label>
    <label>Fecha compromiso<input type="date" id="p_fe" value="${esc(p.fecha)}"></label>
    <label>Avance<select id="p_av">${[0,25,50,75,100].map(n=>`<option value="${n}" ${n===(Number(p.avance)||0)?'selected':''}>${n}%</option>`).join('')}</select></label>
  </div><div class="err" id="p_err"></div></div>
  <div class="mfoot">${idx!==null?`<button class="btn danger" id="p_del">Quitar acción</button>`:''}<span class="sp"></span><button class="btn" data-close>Cancelar</button><button class="btn pri" id="p_save">Guardar acción</button></div>`, true);
  modal.querySelector('#p_save').onclick = async ()=>{
    const accion=v('p_ac').trim(); if(!accion){ modal.querySelector('#p_err').textContent='Describe la acción.'; return; }
    const item={accion,responsable:v('p_re').trim(),fecha:v('p_fe'),avance:Number(v('p_av'))||0};
    const fresh=[...(current()?.pendientes||list)]; if(idx===null) fresh.push(item); else fresh[idx]=item;
    if(await safeWrite(()=>S.db.doc('kaizens/'+k.id).update({pendientes:fresh}),'Acción guardada')) closeModal();
  };
  const del=modal.querySelector('#p_del');
  if(del) del.onclick = async ()=>{ const fresh=[...(current()?.pendientes||list)]; fresh.splice(idx,1); if(await safeWrite(()=>S.db.doc('kaizens/'+k.id).update({pendientes:fresh}),'Acción quitada')) closeModal(); };
}

function segModal(k,n){
  if(!k) return; const r=(k.seguimiento||{})[n]||{}; const m=k.metrico||{};
  openModal(`
  <div class="mhead"><h2>${esc(k.nombre)}: mes ${n/30} (${n} días)</h2><button data-close aria-label="Cerrar">×</button></div>
  <div class="mbody">
    <div class="hint">Fecha programada: ${fd(addDays(k.fechaCierre,n))}. Verifica en piso que la mejora sigue funcionando y registra el valor del métrico primario${m.nombre?` (${esc(m.nombre)})`:''}.${num(m.meta)!==null?` Meta: ${esc(m.meta)} ${esc(m.unidad||'')}; línea base: ${esc(m.base??'—')} ${esc(m.unidad||'')}.`:''}</div>
    <div class="fg">
      <label class="c2">Valor actual del métrico${m.unidad?` (${esc(m.unidad)})`:''}<input type="number" step="any" id="s_va" value="${esc(r.valor)}"></label>
      <label class="c2">¿Se sostiene la mejora?<select id="s_so"><option value="">Selecciona</option><option value="si" ${r.sostenido==='si'?'selected':''}>Sí, se sostiene</option><option value="no" ${r.sostenido==='no'?'selected':''}>No se sostiene</option></select></label>
      <label class="c4">Comentario<textarea id="s_co">${esc(r.comentario)}</textarea></label>
    </div><div class="err" id="s_err"></div></div>
  <div class="mfoot"><span class="sp"></span><button class="btn" data-close>Cancelar</button><button class="btn pri" id="s_save">Guardar revisión</button></div>`, true);
  const vaI=modal.querySelector('#s_va'), soI=modal.querySelector('#s_so');
  vaI.addEventListener('input',()=>{ const x=num(vaI.value), t=num(m.meta); if(x!==null && t!==null) soI.value = (m.sentido==='aumentar' ? x>=t : x<=t) ? 'si' : 'no'; });
  modal.querySelector('#s_save').onclick = async ()=>{
    const so=v('s_so'); if(!so){ modal.querySelector('#s_err').textContent='Indica si la mejora se sostiene.'; return; }
    const seg={...((S.kaizens.find(x=>x.id===k.id)||{}).seguimiento||{})}; seg[n]={valor:v('s_va'),sostenido:so,comentario:v('s_co'),fecha:iso(today()),por:S.me||null};
    if(await safeWrite(()=>S.db.doc('kaizens/'+k.id).update({seguimiento:seg}),'Revisión guardada')) closeModal();
  };
}

/* ========= Presentación ========= */
const deck=$('#deck'); let SL=[], SI=0;
const LOOP=`<svg class="loop" viewBox="0 0 400 300" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" aria-hidden="true"><path d="M-40 20 H250 q20 0 8 18 L150 190 q-30 40 -70 30 q-40 -14 -20 -60 q30 -50 110 -50 q80 0 100 80 q20 90 100 90"/></svg>`;
function tagH(e){ return `<div class="tag" style="--pc:${({P:'#0e9ac0',D:'#6b5aa6',C:'#7b3550',A:'#15803d'})[e]}">${PDCA[e].n}<small>(${PDCA[e].en})</small></div>`; }
function slide(title,body,e,blue){ return `<div class="slide ${blue?'blue':''}">${title?`<div class="sh">${esc(title)}</div>`:''}${e?tagH(e):''}<div class="sb">${body}</div><div class="wm">zubex</div></div>`; }
function buildDeck(k){
  const m=k.metrico||{}; const cu=cumplimiento(m); const out=[];
  out.push(`<div class="slide blue">${LOOP}<div class="cover"><p style="font-size:1.1em;opacity:.85">Evento Kaizen ${esc(k.clave)}, ${esc(k.area||'')}</p><h1>${esc(k.nombre)}</h1><p>${esc(k.detalle||'')}</p><p style="font-size:1em;opacity:.85;margin-top:1em">${fd(k.inicio)} al ${fd(k.fechaCierre||k.fin)}</p></div><div class="wm">zubex</div></div>`);
  out.push(slide('Prework',`
    ${k.descripcion?`<div><b>Breve descripción del evento</b><p class="lead">${esc(k.descripcion)}</p></div>`:''}
    ${k.proposito?`<div><b>Propósito del evento</b><p class="lead">${esc(k.proposito)}</p></div>`:''}
    ${k.beneficios?`<div><b>Beneficios a desarrollar</b><p class="lead">${esc(k.beneficios)}</p></div>`:''}
    ${m.nombre?`<table><thead><tr><th>Objetivo</th><th>Línea base</th><th>Objetivo a lograr</th></tr></thead><tbody><tr><td>${esc(m.nombre)}</td><td>${esc(m.base??'—')} ${esc(m.unidad||'')}</td><td>${esc(m.meta??'—')} ${esc(m.unidad||'')}</td></tr>${(k.metricosSec||[]).map(x=>`<tr><td>${esc(x.nombre)} <small>(secundario)</small></td><td>${esc(x.base??'—')} ${esc(x.unidad||'')}</td><td>${esc(x.meta??'—')} ${esc(x.unidad||'')}</td></tr>`).join('')}</tbody></table>`:''}
    ${(k.enfoque||[]).length?`<p><b>Enfoque de la mejora:</b> ${ENFOQUES.filter(([v])=>(k.enfoque||[]).includes(v)).map(x=>x[1]).join(', ')}</p>`:''}`,'P'));
  if((k.equipo||[]).length) out.push(slide('Equipo Kaizen',`<div class="tm">${k.equipo.map(p=>`<div><b>${esc(p.nombre)}</b>${esc(p.rol||'Integrante')}</div>`).join('')}</div>`,'P'));
  PDCA_ORDER.forEach(e=>{
    S.avances.filter(a=>a.etapa===e).forEach(a=>{
      const imgs=(a.evidencias||[]).filter(x=>x.type&&x.type.startsWith('image/')).slice(0,3);
      const body = imgs.length
        ? `<div class="cols" style="${a.descripcion?'':'grid-template-columns:1fr'}">${a.descripcion?`<p class="desc">${esc(a.descripcion)}</p>`:''}<div class="imgs">${imgs.map(x=>`<img src="${esc(blobUrl(x.id))}" alt="${esc(x.name)}">`).join('')}</div></div>`
        : `<p class="desc">${esc(a.descripcion||'')}</p>`;
      out.push(slide(a.titulo,body,e));
    });
  });
  if(cu && num(m.resultado)!==null){
    const b=num(m.base), r=num(m.resultado), mx=Math.max(b,r)||1;
    out.push(slide('Validación del métrico primario',`<div class="cols"><div class="vbars"><div>${b} ${esc(m.unidad||'')}<i style="height:${b/mx*90}%"></i><span style="font-weight:400">Antes</span></div><div>${r} ${esc(m.unidad||'')}<i style="height:${r/mx*90}%"></i><span style="font-weight:400">Después</span></div></div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:1em"><p style="font-size:2.6em;font-weight:700;color:#0D18A8;line-height:1">${fmtMej(m,cu)}</p><p class="lead">${esc(m.nombre)}${cu.meta!==null?`, contra meta de ${Math.round(cu.meta*100)}%`:''}</p>
      ${num(k.ahorroValidado)||num(k.ahorroEstimado)?`<p><b>Ahorro:</b> ${num(k.ahorroValidado)?`${money(k.ahorroValidado)} validado`:`${money(k.ahorroEstimado)} estimado`}</p>`:''}</div></div>`,'C'));
  }
  const msv=(k.metricosSec||[]).filter(x=>num(x.resultado)!==null);
  if(msv.length) out.push(slide('Validación de métricos secundarios',`<table><thead><tr><th>Métrico</th><th>Línea base</th><th>Meta</th><th>Resultado</th><th>Logro</th></tr></thead><tbody>${msv.map(x=>{const c=cumplimiento(x); return `<tr><td>${esc(x.nombre)}</td><td>${esc(x.base??'—')} ${esc(x.unidad||'')}</td><td>${esc(x.meta??'—')} ${esc(x.unidad||'')}</td><td>${esc(x.resultado)} ${esc(x.unidad||'')}</td><td><b>${c?fmtMej(x,c):'—'}</b></td></tr>`;}).join('')}</tbody></table>`,'C'));
  if((k.pendientes||[]).length) out.push(slide('Acciones pendientes',`<table><thead><tr><th>Acción</th><th>Responsable</th><th>Fecha</th><th>Avance</th></tr></thead><tbody>${k.pendientes.map(p=>`<tr><td>${esc(p.accion)}</td><td>${esc(p.responsable)}</td><td>${fd(p.fecha)}</td><td>${Number(p.avance)||0}%</td></tr>`).join('')}</tbody></table>`,'A'));
  if(k.fechaCierre) out.push(slide('Seguimiento de 3 meses',`<table><thead><tr><th>Revisión</th><th>Fecha</th><th>Resultado</th></tr></thead><tbody>${[30,60,90].map(n=>{const r=(k.seguimiento||{})[n]||{}; return `<tr><td>${n} días</td><td>${fd(addDays(k.fechaCierre,n))}</td><td>${r.sostenido==='si'?'Se sostiene':r.sostenido==='no'?'No se sostiene':'Pendiente'}${r.valor?`, ${esc(r.valor)} ${esc(m.unidad||'')}`:''}</td></tr>`;}).join('')}</tbody></table>`,'A'));
  out.push(`<div class="slide" style="background:#227EF6;color:#fff">${LOOP.replace('stroke="#fff"','stroke="#0D18A8"')}<div class="cover"><h1>¡Gracias!</h1><p>¿Dudas o comentarios?</p></div></div>`);
  return out;
}
function openDeck(k){ if(!k) return; SL=buildDeck(k); SI=0; deck.classList.add('open'); drawDeck(); }
function closeDeck(){ deck.classList.remove('open'); deck.innerHTML=''; }
function deckGo(d){ SI=Math.max(0,Math.min(SL.length-1,SI+d)); drawDeck(); }
function drawDeck(){
  deck.innerHTML=`<div class="dstage">${SL[SI]}</div><div class="dctrl"><button data-d="-1" ${SI===0?'disabled':''}>Anterior</button><span>${SI+1} de ${SL.length}</span><button data-d="1" ${SI===SL.length-1?'disabled':''}>Siguiente</button><button data-d="x">Salir</button></div>`;
}
deck.addEventListener('click',e=>{ const b=e.target.closest('[data-d]'); if(!b) return; if(b.dataset.d==='x') closeDeck(); else deckGo(Number(b.dataset.d)); });
</script>
</body>
</html>
