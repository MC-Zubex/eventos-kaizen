<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventos Kaizen Zubex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%94%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --zx:#0D18A8; --zx2:#227EF6; --onzx:#ffffff;
  --bg:#f8fafc; --surface:#ffffff; --surface2:#f1f5f9; --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --soft:#dbeafe;
  --ok:#166534; --okbg:#dcfce7; --bad:#991b1b; --badbg:#fee2e2; --info:#0D18A8; --infobg:#dbeafe; --gray:#64748b; --graybg:#e2e8f0;
  --p:#0e9ac0; --d:#6b5aa6; --c:#7b3550; --a:#15803d;
  --track:#e2e8f0;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --zx:#0D18A8; --zx2:#5b9dff; --bg:#0e1430; --surface:#151c3f; --surface2:#1b2350; --ink:#e7ebf7; --muted:#a6b0cf; --line:#2a3466; --soft:#1e2a6b;
    --ok:#4ade80; --okbg:#123622; --bad:#f87171; --badbg:#3d1416; --info:#8db8ff; --infobg:#1e2a6b; --gray:#a3adc4; --graybg:#2a3155;
    --p:#38bdf8; --d:#a78bfa; --c:#f0849f; --a:#4ade80; --track:#263063;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --zx:#0D18A8; --zx2:#5b9dff; --bg:#0e1430; --surface:#151c3f; --surface2:#1b2350; --ink:#e7ebf7; --muted:#a6b0cf; --line:#2a3466; --soft:#1e2a6b;
  --ok:#4ade80; --okbg:#123622; --bad:#f87171; --badbg:#3d1416; --info:#8db8ff; --infobg:#1e2a6b; --gray:#a3adc4; --graybg:#2a3155;
  --p:#38bdf8; --d:#a78bfa; --c:#f0849f; --a:#4ade80; --track:#263063;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Poppins','Segoe UI',-apple-system,sans-serif;font-weight:300;font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--zx)}
h1,h2,h3,h4{font-weight:600;line-height:1.25;margin:0}
b,strong{font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--zx2);outline-offset:2px}
a{color:var(--zx2)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--zx);color:var(--onzx)}
.topin{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:14px 24px}
.wordmark{font-weight:700;font-size:30px;letter-spacing:-1px;line-height:1;padding:6px 0}
.apptitle{display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.35);padding-left:18px}
.apptitle b{font-size:17px}
.apptitle span{font-size:12.5px;opacity:.8}
.topin .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--zx2)}
.subbar{background:var(--surface);border-bottom:1px solid var(--line);color:var(--ink)}
.subin{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:0 24px}
.subin .sp{flex:1}
.pacts{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.pacts:empty{display:none}
.tabs{display:flex;gap:6px}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 14px 9px;font-weight:500;font-size:14.5px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--info);border-bottom-color:var(--zx)}
.btn.pri{background:var(--zx);color:#fff;border-color:var(--zx)}
.btn.pri:hover{background:#0a1386}
.btn.onblue{background:#fff;color:var(--zx);border-color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--zx2);padding-left:0}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

main{max-width:1280px;margin:0 auto;padding:24px}
body.wide main,body.wide .topin,body.wide .subin{max-width:none}
body.wide main{padding:16px 24px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;color:var(--muted)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px}
.filters input{min-width:220px;flex:1;max-width:340px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;color:var(--info)}
.kpi .v.bad{color:var(--bad)} .kpi .v.ok{color:var(--ok)}
.kpi .l{font-weight:500;font-size:13.5px;margin-top:2px}
.kpi .s{font-size:12.5px;color:var(--muted)}

/* gráficas */
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.causas{display:grid;grid-template-columns:1fr 1.5fr;gap:20px}
.mhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mhd h2{font-size:19px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.panel h3{font-size:15px;margin-bottom:2px}
.panel .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:118px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:14px;background:var(--track);border-radius:3px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .n{text-align:right;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* tabla */
.tablewrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:max(340px,calc(100vh - 250px - env(safe-area-inset-top,0px)))}
.tablewrap th{position:sticky;top:0;z-index:1}
table{border-collapse:collapse;width:100%;font-size:12px}
th{background:var(--zx);color:#fff;font-weight:500;text-align:left;padding:9px 6px;font-size:12px;vertical-align:bottom;line-height:1.25}
td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
td.nm{min-width:190px;width:30%}
td .prog{width:44px}
td .area{white-space:normal}
td.nm b{display:block;font-weight:600;font-size:15.5px;line-height:1.3;color:var(--ink)}
td.nm span{color:var(--muted);font-size:13px;display:block;margin-top:3px}
td .pill{font-size:11.5px}
td .area{font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap}
.st-Cerrado{background:var(--okbg);color:var(--ok)}
.st-Atrasado{background:var(--badbg);color:var(--bad)}
.st-En{background:var(--infobg);color:var(--info)}
.st-Cancelado{background:var(--graybg);color:var(--gray)}
.area{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.area::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--ac,#94a3b8)}
.prog{width:90px;height:8px;background:var(--track);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.prog i{display:block;height:100%;background:var(--zx2)}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
.method{font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.6;max-width:900px}

/* detalle */
.dhead{display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px;margin:6px 0 18px}
.dhead .t{flex:1;min-width:260px}
.dhead .t .k{color:var(--muted);font-size:13px;margin-bottom:2px}
.dhead h1{font-size:28px;font-weight:700;color:var(--ink)}
.dhead .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;align-items:center;font-size:13px}
.dhead .acts{display:flex;gap:8px;flex-wrap:wrap}

/* línea de 8 pasos */
.steps{position:relative;display:grid;grid-template-columns:repeat(8,1fr);margin:6px 0 26px;padding-top:4px}
.steps::before{content:"";position:absolute;left:6.25%;right:6.25%;top:21px;height:4px;background:var(--track);border-radius:2px}
.steps .fill{position:absolute;left:6.25%;top:21px;height:4px;background:var(--zx2);border-radius:2px}
.step{position:relative;text-align:center;background:none;border:0;padding:0 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
.step .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--surface);border:3px solid var(--track);color:var(--muted);position:relative;z-index:1;font-size:14px}
.step.done .dot{background:var(--zx2);border-color:var(--zx2);color:#fff}
.step.cur .dot{background:var(--zx);border-color:var(--zx);color:#fff;box-shadow:0 0 0 5px var(--soft)}
.step .nm{font-size:12.5px;font-weight:500;line-height:1.25}
.step.cur .nm{color:var(--info);font-weight:600}
.step:disabled{cursor:default}

.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:400}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ptitle h3{font-size:16px}
.txt{white-space:pre-wrap}
.empty{color:var(--muted);font-size:13.5px}
.metric{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.metric th{background:var(--zx);font-size:13px}
.metric td{border-top:1px solid var(--line)}
.enf{display:flex;flex-wrap:wrap;gap:8px}
.enf span{border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted)}
.enf span.on{border-color:var(--zx);background:var(--soft);color:var(--info);font-weight:500}
.team{display:flex;flex-direction:column;gap:8px}
.team div{display:flex;gap:10px;align-items:center}
.team .av{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--info);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.team small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
.big{font-size:24px;font-weight:700;color:var(--info)}
.big.ok{color:var(--ok)} .big.bad{color:var(--bad)}

/* PDCA */
.pdca{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ptabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.ptab{border:0;background:var(--surface);padding:12px 8px 12px 18px;text-align:left;position:relative;border-right:1px solid var(--line)}
.ptab:last-child{border-right:0}
.ptab::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.ptab b{display:block;font-size:15px;color:var(--pc)}
.ptab span{font-size:12.5px;color:var(--muted)}
.ptab.on{background:var(--surface2)}
.ptab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--pc)}
.pbody{display:grid;grid-template-columns:260px 1fr;gap:0}
.guide{padding:16px 18px;border-right:1px solid var(--line);background:var(--surface2);font-size:13.5px}
.guide h4{font-size:13.5px;margin-bottom:8px}
.guide ul{margin:0;padding-left:18px;color:var(--muted)}
.guide li{margin-bottom:5px}
.guide li.has{color:var(--ink)}
.entries{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.entry{border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:8px;padding:12px 14px;background:var(--surface)}
.entry .eh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.entry h4{font-size:15px}
.entry .em{font-size:12.5px;color:var(--muted)}
.entry p{margin:6px 0 0;white-space:pre-wrap;font-size:14px}
.evs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.evs img{height:96px;max-width:170px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.evs a.file{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;text-decoration:none;color:var(--ink)}
.chev{display:inline-block;background:var(--pc);color:#fff;font-weight:600;font-size:12px;padding:3px 16px 3px 10px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%)}

.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.seg h4{font-size:14.5px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.seg .f{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.seg.si{border-color:var(--ok);background:var(--okbg)}
.seg.no{border-color:var(--bad);background:var(--badbg)}
.seg.due{border-style:dashed;border-color:var(--bad)}

.ptable{width:100%;border-collapse:collapse;font-size:13.5px}
.ptable th{background:var(--surface2);color:var(--muted);font-weight:500}
.ptable tr{cursor:default}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,15,40,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.modal.open{display:flex}
.mbox{background:var(--surface);border-radius:12px;width:min(860px,100%);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mbox.narrow{width:min(560px,100%)}
.mhead{background:var(--zx);color:#fff;padding:14px 20px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center}
.mhead h2{font-size:17px}
.mhead button{background:transparent;border:0;color:#fff;font-size:22px;line-height:1}
.mbody{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mfoot .sp{flex:1}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;margin:0}
legend{font-weight:600;font-size:14px;padding:0 6px;color:var(--info)}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}
.fg .c2{grid-column:span 2} .fg .c4{grid-column:1/-1}
.pwbox{display:flex;gap:14px;align-items:center;justify-content:space-between;background:var(--soft);border:1px dashed var(--zx2);border-radius:8px;padding:12px 14px}
.pwbox b{color:var(--info)}
label.pwbtn{flex-direction:row;cursor:pointer;color:var(--zx);background:var(--surface);white-space:nowrap;flex:none}
@media (max-width:560px){.pwbox{flex-direction:column;align-items:flex-start}}
.fg.ms{grid-template-columns:repeat(5,minmax(0,1fr)) auto;align-items:end;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.fg.ms>label:first-child{grid-column:1/-1}
.fg>*{min-width:0}
.mbox{max-width:100%;overflow-wrap:break-word}
.mbody{min-width:0}
fieldset{min-width:0}
label input[type=checkbox]{width:auto}
.dl dd,.entry p,.entry h4,td.nm,.seg,.txt{overflow-wrap:anywhere}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:500;color:var(--muted)}
label input,label select,label textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;font-size:14px;font-weight:300;color:var(--ink)}
textarea{resize:vertical;min-height:70px}
.checks{display:flex;flex-wrap:wrap;gap:14px}
.checks label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-weight:400}
.hint{font-size:12.5px;color:var(--muted);font-weight:300}
.err{color:var(--bad);font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;z-index:80;display:none;max-width:90vw}
.toast.show{display:block}

/* presentación */
.deck{position:fixed;inset:0;z-index:70;background:#0a0f2e;display:none;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.deck.open{display:flex}
.dstage{flex:1;display:grid;place-items:center;padding:16px;min-height:0}
.slide{width:min(100%,calc((100vh - 120px) * 16 / 9));aspect-ratio:16/9;background:#fff;color:#0f172a;position:relative;overflow:hidden;border-radius:4px;display:flex;flex-direction:column;font-size:clamp(10px,1.45vw,19px)}
.slide.blue{background:#0D18A8;color:#fff}
.slide .sh{background:#0D18A8;color:#fff;padding:2.2% 4%;font-size:2.3em;font-weight:700;line-height:1.1}
.slide .sb{flex:1;padding:3% 4%;display:flex;flex-direction:column;gap:1em;min-height:0}
.slide .tag{position:absolute;right:0;top:9%;background:var(--pc);color:#fff;font-weight:600;padding:.5em 1.4em .5em 1.6em;clip-path:polygon(12% 0,100% 0,100% 100%,12% 100%,0 50%);font-size:1.05em;text-align:center;line-height:1.15}
.slide .tag small{display:block;font-weight:300;font-size:.85em}
.slide .wm{position:absolute;right:3%;bottom:3.5%;font-weight:700;font-size:1.9em;color:#0D18A8;letter-spacing:-.04em}
.slide.blue .wm{color:#fff}
.slide .cover{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 6% 9%}
.slide .cover h1{font-size:3.4em;font-weight:700;line-height:1.05}
.slide .cover p{font-size:1.4em;font-weight:400;margin:.4em 0 0}
.slide .loop{position:absolute;right:-6%;top:12%;width:56%;opacity:.95}
.slide p{margin:0}
.slide .lead{font-size:1.25em;color:#0D18A8}
.slide .cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;min-height:0;flex:1}
.slide .imgs{display:flex;gap:.8em;min-height:0;flex:1}
.slide .imgs img{flex:1;min-width:0;object-fit:contain;max-height:100%;border:1px solid #e2e8f0;border-radius:4px;background:#f8fafc}
.slide table{font-size:1em}
.slide table th{background:#0D18A8;color:#fff;padding:.6em .8em;font-size:1em}
.slide table td{padding:.6em .8em;background:#eef2f7;border-top:2px solid #fff}
.slide .tm{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
.slide .tm div{background:#0D18A8;color:#fff;padding:.9em 1em;border-radius:3px}
.slide .tm b{display:block;font-size:1.1em}
.slide .vbars{display:flex;align-items:flex-end;gap:3em;height:60%;padding:0 2em;border-bottom:2px solid #cbd5e1}
.slide .vbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-weight:600}
.slide .vbars i{display:block;width:100%;background:#b6bde0}
.slide .vbars div:last-child i{background:#0D18A8}
.slide .desc{white-space:pre-wrap;font-size:1.1em;line-height:1.45}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ===== Conexión con Supabase (versión GitHub Pages) ===== */
(function(){
  const C = window.KAIZEN_CONFIG || {};
  const configurado = C.url && C.anonKey && !/PEGA_AQUI/.test(C.url + C.anonKey);
  const sb = configurado ? window.supabase.createClient(C.url, C.anonKey) : null;
  window.sb = sb;
  let session = null, editores = {}, isEditor = false, readyResolve;
  const ready = new Promise(r => readyResolve = r);
  const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  window.blobUrl = id => sb ? sb.storage.from('evidencias').getPublicUrl(id).data.publicUrl : '';
  const mapErr = e => {
    const msg = (e && (e.message || e.error_description)) || '';
    if ((e && (e.code === '42501' || e.status === 401 || e.status === 403)) || /row-level security|permission|not authorized/i.test(msg)) return { code: 'invalid_argument', message: msg };
    return { code: 'unavailable', message: msg };
  };

  /* --- Pantalla de acceso --- */
  const lg = document.createElement('div'); lg.id = 'login';
  lg.innerHTML = `<div class="lgbox">
    <div class="lghead"><div class="wordmark">zubex</div><div><b>Eventos Kaizen</b><span>Registro y seguimiento de Mejora Continua</span></div></div>
    ${configurado ? `
    <div class="lgtabs" role="tablist"><button type="button" data-m="c" class="on">Consultar</button><button type="button" data-m="e">Soy editor</button></div>
    <form id="lgform" class="lgform">
      <label id="lgmail" hidden>Correo de Zubex<input type="email" id="lg_email" autocomplete="username" placeholder="nombre@zubex.com.mx"></label>
      <label>Contraseña<input type="password" id="lg_pass" autocomplete="current-password" required></label>
      <p class="hint" id="lghint">Escribe la contraseña de consulta que te compartió Mejora Continua.</p>
      <div class="err" id="lgerr"></div>
      <button class="btn pri" id="lgbtn">Entrar</button>
    </form>` : `<p class="err" style="margin-top:16px">Falta configurar el archivo config.js con la dirección y la llave de Supabase. Revisa la guía de instalación.</p>`}
  </div>`;
  document.body.appendChild(lg);
  let modo = 'c';
  lg.addEventListener('click', e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    modo = b.dataset.m; lg.querySelectorAll('[data-m]').forEach(x => x.classList.toggle('on', x === b));
    lg.querySelector('#lgmail').hidden = modo !== 'e';
    lg.querySelector('#lg_email').required = modo === 'e';
    lg.querySelector('#lghint').textContent = modo === 'e' ? 'Entra con el correo y la contraseña que te asignó Mejora Continua.' : 'Escribe la contraseña de consulta que te compartió Mejora Continua.';
    lg.querySelector(modo === 'e' ? '#lg_email' : '#lg_pass').focus();
  });
  const form = lg.querySelector('#lgform');
  if (form) form.addEventListener('submit', async e => {
    e.preventDefault();
    const err = lg.querySelector('#lgerr'), btn = lg.querySelector('#lgbtn'); err.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando…';
    const email = modo === 'e' ? lg.querySelector('#lg_email').value.trim() : C.correoConsulta;
    const { data, error } = await sb.auth.signInWithPassword({ email, password: lg.querySelector('#lg_pass').value });
    btn.disabled = false; btn.textContent = 'Entrar';
    if (error) { err.textContent = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : 'No se pudo entrar. Revisa tu conexión e inténtalo de nuevo.'; return; }
    afterLogin(data.session);
  });

  async function afterLogin(s){
    session = s;
    const { data } = await sb.from('editores').select('email,nombre');
    editores = {}; (data || []).forEach(x => editores[x.email.toLowerCase()] = x.nombre || x.email);
    isEditor = !!editores[(s.user.email || '').toLowerCase()];
    lg.remove();
    const who = document.getElementById('who');
    if (who) {
      who.innerHTML = `<span>${E(isEditor ? editores[s.user.email.toLowerCase()] : 'Modo consulta')}</span><button type="button" class="btn sm onblue" id="logout">Cerrar sesión</button>`;
      who.querySelector('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
    }
    readyResolve();
  }
  if (sb) sb.auth.getSession().then(({ data }) => { if (data.session) afterLogin(data.session); else { const f = lg.querySelector('#lg_pass'); if (f) f.focus(); } });

  /* --- Base de datos --- */
  const timers = {};
  const later = (k, fn) => { clearTimeout(timers[k]); timers[k] = setTimeout(fn, 250); };
  const rows = r => ({ docs: r.map(x => ({ id: x.id, data: () => x.data || {} })) });
  function collection(path){
    const s = path.split('/');
    if (s.length === 1 && s[0] === 'kaizens') {
      const fetchAll = async () => { const { data, error } = await sb.from('kaizens').select('id,data'); if (error) throw mapErr(error); return rows(data); };
      return {
        get: fetchAll,
        onSnapshot(cb, onErr){
          const load = () => fetchAll().then(cb).catch(e => onErr && onErr(e));
          load();
          const ch = sb.channel('kaizens-' + Math.random().toString(36).slice(2)).on('postgres_changes', { event: '*', schema: 'public', table: 'kaizens' }, () => later('k', load)).subscribe();
          return () => sb.removeChannel(ch);
        }
      };
    }
    if (s.length === 3 && s[0] === 'kaizens' && s[2] === 'avances') {
      const kid = s[1];
      const fetchAll = async () => { const { data, error } = await sb.from('avances').select('id,data').eq('kaizen_id', kid); if (error) throw mapErr(error); return rows(data); };
      return {
        get: fetchAll,
        onSnapshot(cb, onErr){
          const load = () => fetchAll().then(cb).catch(e => onErr && onErr(e));
          load();
          const ch = sb.channel('avances-' + kid + '-' + Math.random().toString(36).slice(2)).on('postgres_changes', { event: '*', schema: 'public', table: 'avances' }, p => { const r = p.new && p.new.kaizen_id ? p.new : p.old; if (!r || !r.kaizen_id || r.kaizen_id === kid) later('a' + kid, load); }).subscribe();
          return () => sb.removeChannel(ch);
        },
        async add(d){ const { data, error } = await sb.from('avances').insert({ kaizen_id: kid, data: d }).select('id'); if (error) throw mapErr(error); if (!data || !data.length) throw { code: 'invalid_argument' }; return { id: data[0].id }; }
      };
    }
    throw new Error('Ruta no soportada: ' + path);
  }
  function doc(path){
    const s = path.split('/');
    const table = s.length === 2 ? 'kaizens' : 'avances'; const id = s.length === 2 ? s[1] : s[3];
    return {
      async get(){ const { data, error } = await sb.from(table).select('data').eq('id', id).maybeSingle(); if (error) throw mapErr(error); return { exists: !!data, data: () => data ? data.data : undefined }; },
      async set(d){ const { data, error } = await sb.from(table).upsert(table === 'kaizens' ? { id, data: d, updated_at: new Date().toISOString() } : { id, kaizen_id: s[1], data: d }).select('id'); if (error) throw mapErr(error); if (!data || !data.length) throw { code: 'invalid_argument' }; },
      async update(d){
        const cur = await sb.from(table).select('data').eq('id', id).maybeSingle(); if (cur.error) throw mapErr(cur.error);
        const merged = { ...((cur.data && cur.data.data) || {}), ...d };
        const patch = table === 'kaizens' ? { data: merged, updated_at: new Date().toISOString() } : { data: merged };
        const { data, error } = await sb.from(table).update(patch).eq('id', id).select('id'); if (error) throw mapErr(error); if (!data || !data.length) throw { code: 'invalid_argument' };
      },
      async delete(){ const { data, error } = await sb.from(table).delete().eq('id', id).select('id'); if (error) throw mapErr(error); if (!data || !data.length) throw { code: 'invalid_argument' }; }
    };
  }
  const dbApi = { collection, doc };
  const userApi = {
    can: async () => isEditor,
    id: async () => session && session.user.email,
    profiles: async ids => { const o = {}; ids.forEach(i => { const k = String(i || ''); o[i] = { name: k.startsWith('n:') ? k.slice(2) : (editores[k.toLowerCase()] || (k.includes('@') ? k.split('@')[0] : '')) }; }); return o; }
  };
  const assetsApi = {
    async upload(file){
      const path = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)) + '/' + file.name.replace(/[^\w.\-]+/g, '_');
      const { error } = await sb.storage.from('evidencias').upload(path, file, { contentType: file.type || undefined });
      if (error) throw mapErr(error);
      return { id: path, url: window.blobUrl(path), contentType: file.type };
    }
  };
  const dlApi = {
    async save({ filename, data }){
      const blob = data instanceof Blob ? data : new Blob([data]);
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return { status: 'saved' };
    }
  };
  window.claude = { use: async n => {
    if (!sb) return null;
    await ready;
    if (n === 'db') return dbApi;
    if (n === 'user') return userApi;
    if (n === 'assets') return isEditor ? assetsApi : null;
    if (n === 'downloads') return dlApi;
    return null;
  } };
})();
</script>
<script>
/* ========= Configuración ========= */
const STEPS = ['Prework','Autorización','Apertura','Ejecución','Revisiones','Presentación','Cierre oficial','Seguimiento'];
const STEP_HELP = [
  'El equipo llena el prework: problema, métrico, línea base, meta y equipo.',
  'Se recaban las firmas de los directores para autorizar el kaizen.',
  'Junta con staff para abrir el kaizen: antecedentes, prework y equipo.',
  'El equipo trabaja en la mejora.',
  'Revisiones de avance con el equipo kaizen.',
  'Con la meta alcanzada, el equipo prepara la presentación.',
  'Se programa y realiza el cierre oficial.',
  'El líder y Mejora Continua dan seguimiento durante 3 meses.'
];
const PDCA = {
  P:{n:'Planear',en:'Plan',v:'--p',guia:['Antecedente del métrico primario','Prework y objetivo del evento','Equipo kaizen','Análisis en piso','Pareto y 5 porqués (causa raíz)']},
  D:{n:'Hacer',en:'Do',v:'--d',guia:['Mejoras implementadas','Prueba piloto','Capacitación y despliegue con el personal','Short kaizens']},
  C:{n:'Verificar',en:'Check',v:'--c',guia:['Validación del métrico primario contra la línea base','Métricos secundarios y beneficios','Ahorro estimado y ahorro validado por Costos']},
  A:{n:'Actuar',en:'Act',v:'--a',guia:['Estandarización: instrucción de trabajo, plan de control, AMEF','Controles y plan de contingencia','Acciones pendientes','Réplicas en otras áreas']}
};
const PDCA_ORDER = ['P','D','C','A'];
const ENFOQUES = [['bienestar','Bienestar del trabajador'],['procesos','Mejora de procesos'],['sustentabilidad','Sustentabilidad'],['rentabilidad','Rentabilidad']];
const CAUSAS = ['Aprobación de cliente','Presupuesto o autorización','Material o equipo','Disponibilidad de personal','Pruebas o validación','Soporte de otra área','Otra'];
const TIPOS = ['Kaizen de 5 días','Kaizen Blitz','Kaizen implementación','Kaizen pausado'];
const AREA_COLORS = {'Extruder':'#1e40af','Impresión':'#b91c1c','Conversión':'#15803d','Corrugado':'#64748b','Ingenieria':'#0e7490','Calidad':'#0284c7','Admon. Productiva':'#3730a3','Innovación':'#4f46e5','RH':'#6d7bd9','Compras':'#1d4ed8','ERP':'#0D18A8','MC':'#227EF6'};
const ST_COLORS = {'Cerrado':'var(--ok)','En proceso':'var(--zx2)','Atrasado':'var(--bad)','Cancelado':'var(--gray)'};

/* ========= Estado ========= */
const S = {db:null,user:null,assets:null,canWrite:null,readOnly:false,me:null,kaizens:[],loaded:false,noDb:false,err:null,
  view:'resumen',hoja:'maestra',openId:null,avances:[],avFor:null,unsubAv:null,tab:'P',names:{},
  f:{q:'',area:'',coach:'',estatus:'',anio:''}};
const $ = s=>document.querySelector(s);
const app = $('#app');

/* ========= Utilidades ========= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function pd(s){ if(!s || !/^\d{4}-\d{2}-\d{2}/.test(s)) return null; const [y,m,d]=s.slice(0,10).split('-').map(Number); return new Date(y,m-1,d); }
function fd(s){ const d=pd(s); return d? `${d.getDate()} ${MES[d.getMonth()]} ${d.getFullYear()}` : '—'; }
function fds(s){ const d=pd(s); return d? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(2)}` : '—'; }
function iso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function addDays(s,n){ const d=pd(s); if(!d) return null; d.setDate(d.getDate()+n); return iso(d); }
function days(a,b){ const x=pd(a), y=pd(b); if(!x||!y) return null; return Math.round((y-x)/86400000); }
const money = n => (n===null||n===undefined||n==='') ? '—' : new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(n));
const num = v => (v===''||v===null||v===undefined||isNaN(Number(v))) ? null : Number(v);
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function statusOf(k){
  if(k.cancelado) return 'Cancelado';
  if(k.fechaCierre) return 'Cerrado';
  const f=pd(k.fin); if(f && today()>f) return 'Atrasado';
  return 'En proceso';
}
const stClass = s => 'st-'+s.split(' ')[0];
const pill = s => `<span class="pill ${stClass(s)}">${esc(s)}</span>`;
const areaTag = a => `<span class="area" style="--ac:${AREA_COLORS[a]||'#94a3b8'}">${esc(a||'—')}</span>`;
function segPendientes(k){
  if(statusOf(k)!=='Cerrado') return [];
  const out=[]; const seg=k.seguimiento||{};
  for(const n of [30,60,90]){ const due=addDays(k.fechaCierre,n); if(due && today()>=pd(due) && !(seg[n]&&seg[n].sostenido)) out.push(n); }
  return out;
}
function cumplimiento(m){
  if(!m) return null; const b=num(m.base), t=num(m.meta), r=num(m.resultado);
  if(b===null||r===null||b===0) return null;
  const mejora = m.sentido==='aumentar' ? (r-b)/b : (b-r)/b;
  const meta = t===null?null:(m.sentido==='aumentar' ? (t-b)/b : (b-t)/b);
  return {mejora, meta, logrado: meta===null?null: mejora>=meta};
}
function fmtMej(m,c){ const p=Math.abs(Math.round(c.mejora*100)); const up=m.sentido==='aumentar'; return ((c.mejora>=0)===up?'+':'−')+p+'%'; }
function writable(){ return !!S.db && S.canWrite!==false && !S.readOnly; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3200); }
async function safeWrite(fn, okMsg){
  try{ await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    if(e && e.code==='invalid_argument'){ S.readOnly=true; render(); toast('No tienes permiso para editar. Pide acceso de Colaborador a quien comparte la aplicación.'); }
    else if(e && e.code==='quota_exceeded'){ toast('Se llenó el espacio de la base de datos. Elimina registros que ya no necesites.'); }
    else { toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.'); }
    return false;
  }
}
async function resolveNames(ids){
  ids=[...new Set(ids.filter(Boolean))].filter(i=>!(i in S.names));
  if(!ids.length||!S.user) return;
  try{ const ps=await S.user.profiles(ids); let ch=false; for(const i of ids){ S.names[i]=(ps[i]&&ps[i].name)||''; ch=true; } if(ch) render(); }catch(e){}
}
const nameOf = id => (id && S.names[id]) || 'Alguien del equipo';

/* ========= Arranque ========= */
render();
(async()=>{
  const use = window.claude && window.claude.use ? n=>window.claude.use(n) : async()=>null;
  const [db,user,assets,downloads] = await Promise.all([use('db'),use('user'),use('assets'),use('downloads')]);
  S.db=db; S.user=user; S.assets=assets; S.downloads=downloads;
  if(user){ try{ S.canWrite = await user.can('data.write'); }catch(e){} try{ S.me = await user.id(); }catch(e){} }
  if(!db){ S.noDb=true; S.loaded=true; render(); return; }
  db.collection('kaizens').onSnapshot(snap=>{
    S.kaizens = snap.docs.map(d=>({id:d.id,...d.data()}));
    const first=!S.loaded; S.loaded=true;
    if(first){ const h=(location.hash||'').slice(1); if(h==='maestra'||h==='dashboard'||h==='seguimiento') S.hoja=h; else if(h && S.kaizens.some(k=>k.id===h)){ openProject(h); return; } }
    render();
  }, e=>{ S.err=e.code; S.loaded=true; render(); });
})();

/* ========= Render principal ========= */
function render(){
  const inP = S.view==='proyecto' && !!current();
  $('#btnNew').hidden = !writable() || inP;
  $('#pacts').innerHTML = inP ? `<button class="btn sm" data-act="deck">Ver como presentación</button>${writable()?'<button class="btn pri sm" data-act="edit">Editar carátula</button>':''}` : '';
  document.body.classList.toggle('wide', S.view==='resumen' && (S.hoja==='maestra'||S.hoja==='seguimiento'));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', S.view==='resumen' && b.dataset.hoja===S.hoja));
  $('#pie').textContent = `Generado: ${fd(iso(today()))}. Mejora Continua, Zubex Industrial.`;
  if(S.view==='proyecto'){ app.innerHTML = viewProyecto(); return; }
  if(S.loaded && !S.noDb && !S.err && document.getElementById('filters')){ renderResults(); return; }
  app.innerHTML = viewResumen();
  if(document.getElementById('results')) renderResults();
}

function viewResumen(){
  if(!S.loaded) return `<div class="notice">Cargando kaizens…</div>`;
  if(S.noDb) return `<div class="notice">No hay conexión con la base de datos. Revisa el archivo config.js.</div>`;
  if(S.err) return `<div class="notice">No se pudo leer la base de datos (${esc(S.err)}). Recarga la página.</div>`;
  const areas=[...new Set(S.kaizens.map(k=>k.area).filter(Boolean))].sort();
  const coaches=[...new Set(S.kaizens.map(k=>k.coach).filter(Boolean))].sort();
  const anios=[...new Set(S.kaizens.map(k=>(k.inicio||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const opt=(arr,sel)=>arr.map(a=>`<option ${a===sel?'selected':''}>${esc(a)}</option>`).join('');
  return `
  <div class="filters" id="filters">
    <input type="search" id="fq" placeholder="Buscar por proyecto, líder o detalle" value="${esc(S.f.q)}" aria-label="Buscar">
    <select id="farea" aria-label="Área"><option value="">Todas las áreas</option>${opt(areas,S.f.area)}</select>
    <select id="fcoach" aria-label="Coach"><option value="">Todos los coaches</option>${opt(coaches,S.f.coach)}</select>
    <select id="fest" aria-label="Estatus"><option value="">Todos los estatus</option>${opt(['En proceso','Atrasado','Cerrado','Cancelado'],S.f.estatus)}</select>
    <select id="fanio" aria-label="Año de inicio"><option value="">Todos los años</option>${opt(anios,S.f.anio)}</select>
  </div>
  <div id="results"></div>
  <p class="method"><b>Nota metodológica.</b> El estatus se calcula solo: Cancelado si así se marcó, Cerrado si tiene fecha de cierre oficial, Atrasado si pasó la fecha fin sin cierre, y En proceso en otro caso. Los kaizens cerrados requieren revisión de sostenimiento a los 30, 60 y 90 días de su cierre; una revisión vencida es la que ya pasó su fecha y no tiene resultado registrado. El ahorro validado es el que confirmó Costos; el estimado es el que declara el equipo. Los filtros aplican a indicadores, gráficas y tabla.</p>`;
}

function filtered(){
  const q=S.f.q.trim().toLowerCase();
  return S.kaizens.filter(k=>{
    if(S.f.area && k.area!==S.f.area) return false;
    if(S.f.coach && k.coach!==S.f.coach) return false;
    if(S.f.estatus && statusOf(k)!==S.f.estatus) return false;
    if(S.f.anio && (k.inicio||'').slice(0,4)!==S.f.anio) return false;
    if(q && !`${k.nombre} ${k.detalle} ${k.lider} ${k.clave}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(Number(b.clave)||0)-(Number(a.clave)||0));
}

  const areasArr=Object.entries(am).sort((a,b)=>b[1].t-a[1].t); const maxA=Math.max(1,...areasArr.map(a=>a[1].t));

  const kpisH = `
  <section class="kpis" aria-label="Indicadores">

    <div class="kpi"><div class="v ok">${cerr.length}</div><div class="l">Cerrados</div><div class="s">${pct(aTiempo,cerr.length)} cerró a tiempo</div></div>
    <div class="kpi"><div class="v">${proc.length}</div><div class="l">En proceso a tiempo</div><div class="s">de ${activos} activos</div></div>
    <div class="kpi"><div class="v ${atr.length?'bad':'ok'}">${atr.length}</div><div class="l">Atrasados</div><div class="s">${pct(atr.length,activos)} de los activos</div></div>
    <div class="kpi"><div class="v ${ahV?'ok':''}">${money(ahV)}</div><div class="l">Ahorro validado</div><div class="s">Estimado ${money(ahE)}</div></div>
    <div class="kpi"><div class="v ${segV?'bad':'ok'}">${segV}</div><div class="l">Revisiones de sostenimiento vencidas</div><div class="s">30, 60 y 90 días</div></div>

  const chartsH = `
  <section class="charts">
    <div class="panel"><h3>En qué paso está cada kaizen</h3><div class="sub">Sin cancelados</div>
      <div class="bars">${porPaso.map((n,i)=>`<div class="bar"><span class="lb">${i+1}. ${STEPS[i]}</span><span class="tr"><i style="width:${n*100/maxP}%;background:var(--zx)"></i></span><span class="n">${n}</span></div>`).join('')}</div></div>
    <div class="panel"><h3>Estatus por área</h3><div class="sub">Número de kaizens</div>
      <div class="bars">${areasArr.map(([a,o])=>`<div class="bar"><span class="lb">${esc(a)}</span><span class="tr" style="width:${o.t*100/maxA}%">${stOrder.map(s=>o[s]?`<i style="flex:${o[s]};background:${ST_COLORS[s]}" title="${s}: ${o[s]}"></i>`:'').join('')}</span><span class="n">${o.t}</span></div>`).join('')}</div>
      <div class="legend">${stOrder.map(s=>`<span style="--c:${ST_COLORS[s]}">${s}</span>`).join('')}</div></div>
  </section>`;
  const atrS=[...atr].sort((a,b)=>(days(b.fin,iso(today()))||0)-(days(a.fin,iso(today()))||0));

      ${atr.length?`<div style="overflow-x:auto"><table class="ptable"><thead><tr><th>Proyecto</th><th>Días de atraso</th><th>Causa</th><th>Observaciones</th></tr></thead><tbody>${atrS.map(k=>`<tr data-open="${esc(k.id)}" tabindex="0" style="cursor:pointer"><td><b style="font-weight:500">${esc(k.nombre)}</b><div class="hint">${esc(k.area)}, ${esc(k.lider)}</div></td><td class="nowrap" style="color:var(--bad);font-weight:600">${days(k.fin,iso(today()))}</td><td>${esc(k.causaAtraso||'Sin registrar')}</td><td class="hint">${esc(k.observaciones||'')}</td></tr>`).join('')}</tbody></table></div>`:''}

  const tableH = `

      <td class="nowrap"><span class="prog"><i style="width:${Math.min(100,Number(k.avance)||0)}%"></i></span>${Number(k.avance)||0}%</td>

  </table></div>`;
  if(S.hoja==='seguimiento'){ el.innerHTML = segSheet(ks); return; }
  el.innerHTML = S.hoja==='maestra' ? headH + tableH : kpisH + chartsH + causasH;

function segEstado(k){
  const seg=k.seguimiento||{}; const rs=[30,60,90].map(n=>seg[n]&&seg[n].sostenido);
  if(rs.includes('no')) return ['No sostenido','st-Atrasado'];
  if(rs.every(r=>r==='si')) return ['Sostenido','st-Cerrado'];
  if(segPendientes(k).length) return ['Revisión vencida','st-Atrasado'];
  return ['En seguimiento','st-En'];
}
function segSheet(ks){
  const cl=ks.filter(k=>statusOf(k)==='Cerrado').sort((a,b)=>(b.fechaCierre||'').localeCompare(a.fechaCierre||''));
  const est=cl.map(segEstado).map(e=>e[0]);
  const cnt=s=>est.filter(e=>e===s).length;
  const venc=cl.reduce((s,k)=>s+segPendientes(k).length,0);
  const w=writable();
  const val=(y,u)=>(y===null||y===undefined||y==='')?'—':`${esc(y)} ${u}`;
  const cell=(k,n)=>{
    const r=(k.seguimiento||{})[n]||{}; const due=addDays(k.fechaCierre,n); const vc=!r.sostenido && today()>=pd(due); const u=esc((k.metrico||{}).unidad||'');
    return `<td class="sc"><div class="hint">${fds(due)}</div>${r.sostenido
      ? `<div style="font-weight:600;font-size:13.5px">${val(r.valor,u)}</div><span class="pill ${r.sostenido==='si'?'st-Cerrado':'st-Atrasado'}">${r.sostenido==='si'?'Se sostiene':'No se sostiene'}</span>`
      : `<span class="pill ${vc?'st-Atrasado':'st-En'}">${vc?'Vencida':'Pendiente'}</span>`}
      ${w?`<div><button class="btn ghost sm" style="padding:3px 0 0" data-segk="${esc(k.id)}" data-segn="${n}">${r.sostenido?'Editar':'Registrar resultado'}</button></div>`:''}</td>`;
  };
  return `
  <div class="mhd"><h2>Seguimiento de kaizens cerrados</h2><span class="muted">Revisión mensual del métrico primario durante 3 meses después del cierre oficial.</span></div>
  <section class="kpis" style="grid-template-columns:repeat(5,1fr)">
    <div class="kpi"><div class="v">${cl.length}</div><div class="l">Kaizens cerrados</div></div>
    <div class="kpi"><div class="v">${cnt('En seguimiento')}</div><div class="l">En seguimiento</div><div class="s">Sin revisiones vencidas</div></div>
    <div class="kpi"><div class="v ok">${cnt('Sostenido')}</div><div class="l">Sostenidos</div><div class="s">Los 3 meses se sostienen</div></div>
    <div class="kpi"><div class="v ${cnt('No sostenido')?'bad':''}">${cnt('No sostenido')}</div><div class="l">No sostenidos</div><div class="s">Al menos un mes no se sostuvo</div></div>
    <div class="kpi"><div class="v ${venc?'bad':'ok'}">${venc}</div><div class="l">Revisiones vencidas</div><div class="s">Ya pasó la fecha sin resultado</div></div>
  </section>
  <div class="tablewrap" style="max-height:max(340px,calc(100vh - 360px))"><table>
    <thead><tr><th>Clave</th><th>Proyecto</th><th>Área</th><th>Líder</th><th>Cierre oficial</th><th>Línea base</th><th>Meta</th><th>Al cierre</th><th>Mes 1<br>(30 días)</th><th>Mes 2<br>(60 días)</th><th>Mes 3<br>(90 días)</th><th>Estado</th></tr></thead>
    <tbody>${cl.length? cl.map(k=>{const m=k.metrico||{}; const u=esc(m.unidad||''); const e=segEstado(k); return `<tr style="cursor:default">
      <td>${esc(k.clave)}</td>
      <td class="nm"><b><a href="#${esc(k.id)}" data-open="${esc(k.id)}" style="color:inherit;text-decoration:none">${esc(k.nombre)}</a></b><span>${m.nombre?esc(m.nombre):'Sin métrico primario capturado'}</span></td>
      <td>${areaTag(k.area)}</td><td>${esc(k.lider)}</td><td class="nowrap">${fds(k.fechaCierre)}</td>
      <td class="nowrap">${val(m.base,u)}</td><td class="nowrap">${val(m.meta,u)}</td><td class="nowrap" style="font-weight:600">${val(m.resultado,u)}</td>
      ${cell(k,30)}${cell(k,60)}${cell(k,90)}
      <td><span class="pill ${e[1]}">${e[0]}</span></td></tr>`;}).join('') : `<tr><td colspan="12" class="empty">No hay kaizens cerrados con estos filtros.</td></tr>`}</tbody>
  </table></div>`;
}

/* ========= Vista de proyecto ========= */
function current(){ return S.kaizens.find(k=>k.id===S.openId); }
function openProject(id){
  S.view='proyecto'; S.openId=id; S.tab='P'; S.avances=[];
  try{ location.hash=id; }catch(e){}
  if(S.unsubAv){ S.unsubAv(); S.unsubAv=null; }
  if(S.db){
    S.unsubAv = S.db.collection(`kaizens/${id}/avances`).onSnapshot(snap=>{
      S.avances = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||'')||(a.creado||'').localeCompare(b.creado||''));
      resolveNames(S.avances.map(a=>a.autor));
      render();
    }, ()=>{});
  }
  render(); window.scrollTo(0,0);
}
function closeProject(){
  if(S.unsubAv){ S.unsubAv(); S.unsubAv=null; }
  S.view='resumen'; S.openId=null; S.avances=[];
  try{ location.hash=S.hoja; }catch(e){}
  app.innerHTML=''; render(); window.scrollTo(0,0);
}

function importMigracion(btn){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    let j; try{ j=JSON.parse(await f.text()); }catch(e){ toast('El archivo no es un archivo de migración válido.'); return; }
    if(!j || j.formato!=='kaizen-zubex-migracion'){ toast('El archivo no es un archivo de migración válido.'); return; }
    if(!confirm(`Se importarán ${j.kaizens.length} kaizens, ${j.avances.length} avances y ${Object.keys(j.archivos||{}).length} evidencias. Si un kaizen ya existe aquí, se reemplazará con la versión del archivo. ¿Continuar?`)) return;
    const label=btn.textContent; btn.disabled=true;
    try{
      const map={}; const ids=Object.keys(j.archivos||{}); let fallas=0;
      for(let i=0;i<ids.length;i++){
        btn.textContent=`Subiendo evidencias ${i+1} de ${ids.length}…`;
        const a=j.archivos[ids[i]]; const ev=j.avances.flatMap(x=>x.data.evidencias||[]).find(e=>e.id===ids[i])||{};
        try{ const bin=atob(a.data); const u8=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u8[k]=bin.charCodeAt(k);
          const file=new File([u8],ev.name||('evidencia-'+(i+1)),{type:a.type||ev.type||'application/octet-stream'});
          const r=await S.assets.upload(file); map[ids[i]]=r.id; }catch(e){ fallas++; }
      }
      btn.textContent='Guardando kaizens…';
      const kr=j.kaizens.map(k=>({id:k.id,data:k.data,updated_at:new Date().toISOString()}));
      for(let i=0;i<kr.length;i+=200){ const {error}=await sb.from('kaizens').upsert(kr.slice(i,i+200)); if(error) throw error; }
      btn.textContent='Guardando avances…';
      const ar=j.avances.map(a=>{ const d={...a.data}; if(d.autor) d.autor = d.autorNombre ? 'n:'+d.autorNombre : null; delete d.autorNombre;
        d.evidencias=(d.evidencias||[]).filter(e=>map[e.id]).map(e=>({...e,id:map[e.id]})); return {id:a.id,kaizen_id:a.kaizenId,data:d}; });
      for(let i=0;i<ar.length;i+=200){ const {error}=await sb.from('avances').upsert(ar.slice(i,i+200)); if(error) throw error; }
      toast(`Importación terminada: ${kr.length} kaizens, ${ar.length} avances y ${ids.length-fallas} evidencias.${fallas?` ${fallas} evidencias no se pudieron subir.`:''}`);
    }catch(e){ toast('La importación se detuvo: '+(e.message||'revisa tu conexión y que tu usuario sea editor.')); }
    btn.disabled=false; btn.textContent=label;
  };
  inp.click();
}

/* ========= Lectura del Excel de prework ========= */
let _xlsxP=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!_xlsxP) _xlsxP=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>res(window.XLSX); s.onerror=()=>{ _xlsxP=null; rej(new Error('load')); }; document.head.appendChild(s); });
  return _xlsxP;
}
function pwDate(x){
  if(x instanceof Date && !isNaN(x)) return iso(new Date(x.getFullYear(),x.getMonth(),x.getDate()+(x.getHours()>=12?1:0)));
  if(typeof x==='number' && x>30000 && x<80000){ const d=new Date(Date.UTC(1899,11,30)+Math.round(x)*86400000); return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())); }
  const m=String(x||'').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ const y=m[3].length===2?2000+Number(m[3]):Number(m[3]); return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; }
  return '';
}
function pwVal(x){
  if(typeof x==='number') return {v:x,time:false};
  const s=String(x??'').replace(/,/g,'');
  const tm=s.match(/(\d+):(\d{2})/); if(tm) return {v:Number(tm[1])*60+Number(tm[2]),time:true};
  const f=s.match(/-?\d+(\.\d+)?/); return {v:f?Number(f[0]):null,time:false};
}
function parsePrework(wb){
  const name=wb.SheetNames.find(n=>n.toLowerCase().replace(/[\s\-_]/g,'').includes('prework'));
  if(!name) return null; const ws=wb.Sheets[name];
  const raw=a=>{ const c=ws[a]; return c?c.v:null; };
  const t=a=>{ const x=raw(a); if(x===null||x===undefined) return ''; if(x instanceof Date) return pwDate(x); return String(x).trim(); };
  const after=(a,label)=>t(a).replace(new RegExp('^\\s*'+label+'\\s*:?','i'),'').trim();
  const notas=[];
  const metric=(cN,cB,cT)=>{
    const nombre=t(cN); if(!nombre) return {};
    const bt=t(cB), tt=t(cT); const b=pwVal(raw(cB)); const g=pwVal(raw(cT));
    let unidad=''; if(b.time) unidad='s'; else { const u=bt.match(/\d[\d.,]*\s*(%|[a-zA-Záéíóúñ]+)/); if(u) unidad=u[1]; }
    const sentido=/aument|increm|incre|subir|elevar/i.test(tt)?'aumentar':'reducir';
    let meta=g.v;
    if(g.v!==null && /%/.test(tt) && /reduc|dismin|aument|increm|bajar|subir/i.test(tt) && b.v!==null && unidad!=='%'){ meta=Math.round(b.v*(sentido==='aumentar'?1+g.v/100:1-g.v/100)*100)/100; }
    else if(g.time) meta=g.v;
    if(b.v===null && bt) notas.push(`Revisa la línea base de “${nombre}”: no es un número (${bt}).`);
    if(meta===null && tt) notas.push(`Revisa la meta de “${nombre}”: no es un número (${tt}).`);
    return {nombre,unidad,sentido,base:b.v,meta,resultado:null};
  };
  const cli=[['D9','Entregas a cliente'],['F9','Calidad'],['H9','Mejora en costo'],['J9','Otros']].map(([a,l])=>{ const x=after(a,l); return x?`${l}: ${x}`:''; }).filter(Boolean).join('\n');
  const tipoIdx=['A13','C13','D13','F13'].findIndex(a=>/x/i.test(t(a)));
  const inicio=pwDate(raw('K46'))||pwDate(after('K45','del'))||pwDate(raw('K44'));
  const fin=pwDate(raw('L46'))||pwDate(after('L45','al'))||pwDate(raw('L44'));
  const equipo=[];
  for(let r=48;r<=54;r++){ const nm=t('I'+r); if(nm && !/^nombre$/i.test(nm)) equipo.push({nombre:nm,rol:t('L'+r)||'Integrante'}); }
  const ah=pwVal(raw('I32')).v;
  return {
    nombre:t('D6'), descripcion:t('D6'), proposito:t('D7'), beneficios:t('D8'), cliente:cli,
    tipo: tipoIdx>=0 ? TIPOS[tipoIdx] : '', dueno:t('C44'), inicio, fin,
    metrico:metric('C32','D32','F32'), secundario:metric('C38','D38','F38'),
    ahorro: ah, equipo, notas
  };
}
